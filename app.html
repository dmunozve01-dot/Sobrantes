  <div id="productSheet" class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content">
      <h3 id="prodDesc">Nombre del Producto</h3>
      <span class="badge-code" id="prodCode">000000</span>
      
      <!-- ESTADO DEL PRODUCTO -->
      <div id="estadoProductoBox" style="display: none; margin-bottom: 15px; padding: 8px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1rem;">
      </div>

      <div class="price-row">
        <div class="price-box">
          <span>Costo Unit.</span>
          <strong id="prodCost">S/ 0.00</strong>
        </div>
        <div class="price-box input-box">
          <span>Cantidad Total</span>
          <input type="number" id="inputCantidad" min="0" value="0">
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button type="button" id="btnAddUnit" class="btn" style="flex: 1; background: var(--bg-hover); color: var(--text-main); font-size: 0.9rem; padding: 10px;">
          <i class="fa-solid fa-plus"></i> 1 Unidad
        </button>
        <button type="button" id="btnAddBox" class="btn" style="display: none; flex: 1; background: var(--neon-cyan); color: #000; font-size: 0.9rem; padding: 10px;">
          <i class="fa-solid fa-box"></i> 1 Bulto (<span id="prodStdCase">0</span>)
        </button>
      </div>

      <div class="total-box">
        <span>Total a levantar:</span>
        <h2>S/ <span id="totalCost">0.00</span></h2>
      </div>

      <div class="action-buttons" style="display: flex; gap: 5px;">
        <button class="btn btn-cancel" id="btnCancelScan" style="flex: 1; padding: 12px 5px; font-size: 0.8rem;">Cancelar</button>
        <button class="btn btn-success" id="btnSave" style="flex: 1; padding: 12px 5px; font-size: 0.8rem;">
          <i class="fa-solid fa-plus"></i> Agregar
        </button>
      </div>
    </div>
  </div>
